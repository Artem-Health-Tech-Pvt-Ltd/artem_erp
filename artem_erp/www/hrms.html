		<style>
			/* Custom Artem HR branding */
			.flex.flex-col.mx-auto.gap-3.items-center svg {
				display: none !important;
			}
			.flex.flex-col.mx-auto.gap-3.items-center::before {
				content: "";
				display: block;
				width: 44px;
				height: 44px;
				background: url("/assets/artem_erp/images/artem_logo.png") no-repeat center / contain;
				margin-bottom: 2px;

	<body class="antialiased">
		<div id="app"></div>
		<div id="modals"></div>
		<div id="popovers"></div>

		<script>
			window.csrf_token = "{{ csrf_token }}"
			window.site_name = '{{ site_name }}'
			if (!window.frappe) window.frappe = {}
			frappe.boot = {{ boot }}
			if (!frappe.boot) frappe.boot = {}
			if (!frappe.boot.__messages) frappe.boot.__messages = {}
			frappe.boot.__messages["Login to Frappe HR"] = "Login to Artem HR"
			frappe.boot.__messages["Install Frappe HR"] = "Install Artem HR"
			frappe.boot.__messages["Frappe HR"] = "Artem HR"

			(function() {
				function customizeHRMS() {
					var container = document.querySelector(".flex.flex-col.mx-auto.gap-3.items-center");
					if (container) {
						var svg = container.querySelector("svg");
						if (svg) {
							svg.style.display = "none";
						}
						if (!container.querySelector("img.artem-hrms-logo")) {
							var img = document.createElement("img");
							img.src = "/assets/artem_erp/images/artem_logo.png";
							img.alt = "Artem Logo";
							img.className = "h-11 w-11 object-contain artem-hrms-logo";
							container.prepend(img);
						}
						var titleEl = container.querySelector(".text-3xl");
						if (titleEl && titleEl.textContent.trim() === "Login to Frappe HR") {
							titleEl.textContent = "Login to Artem HR";
						}
					}
				}
				if (typeof MutationObserver !== "undefined") {
					var observer = new MutationObserver(customizeHRMS);
					observer.observe(document.documentElement, { childList: true, subtree: true });
				}
				document.addEventListener("DOMContentLoaded", customizeHRMS);
			})();
		</script>
